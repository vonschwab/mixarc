library:
  music_directory: /path/to/music
  database_path: data/metadata.db
analyze:
  muq:
    device: cpu        # cpu|cuda — MuQ-MuLan extraction device
    torch_threads: 0   # 0 = all available
    fold_into_artifact: true  # after every artifacts rebuild, fold the MuQ sidecar
                              # back in and set X_sonic_variant=muq. Set false to
                              # keep the tower rollback active (see
                              # artifacts.sonic_variant_override below).
  energy:
    distro: "Ubuntu-22.04"        # WSL distro hosting the Essentia venv
    python: "/opt/ess/bin/python" # interpreter inside that distro
    models_dir: "/opt/ess/models" # Essentia model dir (preflight checks it)
    workers: 14                   # parallel decode workers (--energy-workers overrides)
  pace:
    energy_features: ["arousal_p50"]   # configurable; danceability/arousal_p10/p90 available
  # Pre-flight connectivity check before an analyze run. When true (default),
  # each CONFIGURED external service (Last.fm, Discogs, the enrichment LLM) is
  # tested before any stage runs, and the run aborts fast with a fix hint if a
  # configured service is unreachable (a NOT-configured service is skipped, not
  # failed). Set to false to skip pre-flight — this is the ONLY bypass for GUI
  # runs (the CLI also accepts --no-preflight).
  preflight: true
discogs:
  token: ''
lastfm:
  api_key: ''
  username: ''
  history_days: 90
  artist_top_tracks_limit: 50      # how many top tracks to fetch per artist (popularity stage)
  recheck_miss_days: 30            # an album Last.fm has no tags for is skipped for this
                                   # many days, then retried once (tags accrue over time).
                                   # 0 = disable the miss-cache (re-fetch every miss, every run).
plex:
  enabled: false
  base_url: http://localhost:32400
  token: ''
  music_section: Music
  verify_ssl: true
  replace_existing: true
  path_map: []
ai_genre:
  # Genre enrichment backend:
  #   zero_touch   - deterministic, free APIs, no LLM (public default; needs no account)
  #   claude_code  - Claude Code subscription auth (best quality)
  #   anthropic_api- your own Anthropic API key (ANTHROPIC_API_KEY env var)
  #   openai       - your own OpenAI API key
  #   skip         - no enrichment; genres = file tags + Discogs/Last.fm fetches only
  provider: zero_touch
  claude_model: haiku    # model alias for claude_code/anthropic_api calls ('haiku' | 'sonnet' | 'opus')
playlists:
  count: 8
  tracks_per_playlist: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # MODE-BASED CONFIGURATION (Simpler Alternative to Manual Tuning)
  # ═══════════════════════════════════════════════════════════════════════════
  # Instead of manually setting weights and thresholds in genre_similarity below,
  # you can use simple mode presets that configure everything automatically.
  #
  # GENRE MODES (how strictly to match genre):
  #   strict:   Ultra-tight genre matching (weight 0.80, threshold 0.50)
  #   narrow:   Stay close to seed genre (weight 0.65, threshold 0.40)
  #   dynamic:  Balanced exploration (weight 0.50, threshold 0.30) ← default
  #   discover: Genre-adjacent exploration (weight 0.35, threshold 0.20)
  #   off:      Sonic-only mode (ignore genre tags completely)
  #
  # SONIC MODES (how strictly to match audio features):
  #   strict:   Ultra-tight sonic matching (weight 0.85, tight pool)
  #   narrow:   Cohesive sound (weight 0.70, tighter pool)
  #   dynamic:  Balanced sonic flow (weight 0.50, standard pool) ← default
  #   discover: Varied textures (weight 0.35, wider pool)
  #   off:      Genre-only mode (ignore sonic features completely)
  #
  # PACE MODES (rhythm/tempo coherence — orthogonal to sonic_mode and genre_mode):
  #   strict:   Tight tempo fidelity (rhythm floors 0.55/0.65, BPM max-log 0.30/0.40)
  #   narrow:   Moderate tempo anchoring (rhythm 0.35/0.45, BPM 0.50/0.60)
  #   dynamic:  Gentle anchoring — catches double-time, allows natural drift (rhythm 0.20/0.25, BPM 0.75/0.85)
  #   off:      No pace gate — rhythm still influences via the sonic embedding at 20% weight
  #
  # EXAMPLES:
  #   genre_mode: dynamic      # Balanced genre + sonic (50/50)
  #   sonic_mode: dynamic
  #
  #   genre_mode: strict       # Ultra-cohesive playlists
  #   sonic_mode: strict
  #
  #   genre_mode: narrow       # Same genre, varied sound
  #   sonic_mode: discover
  #
  #   genre_mode: off          # Pure sonic similarity
  #   sonic_mode: dynamic
  #
  #   genre_mode: dynamic      # Pure genre matching (NEW!)
  #   sonic_mode: off
  #
  # If mode settings are present, they OVERRIDE manual genre_similarity settings below.
  # Uncomment to enable mode-based configuration:
  #
  # genre_mode: dynamic
  # sonic_mode: dynamic
  # pace_mode: dynamic
  # cohesion_mode: dynamic
  #
  # ═══════════════════════════════════════════════════════════════════════════


  history_days: 14
  seed_count: 5
  name_prefix: 'Auto:'
  max_age_days: 14
  export_m3u: true
  m3u_export_path: /path/to/playlists
  name_format: artists
  recently_played_filter:
    enabled: true
    # Recency exclusions are applied during candidate selection (pre-order) for DS pier-bridge runs.
    # Post-order filtering/shrinking is forbidden; runs fail loudly on violations.
    lookback_days: 30
    min_playcount_threshold: 0
  min_duration_minutes: 90
  min_track_duration_seconds: 46
  max_track_duration_seconds: 720
  max_tracks_per_artist: 3
  artist_window_size: 8
  max_artist_per_window: 1
  min_seed_artist_ratio: 0.125
  pipeline: ds
  cohesion_mode: dynamic
  ds_pipeline:
    artifact_path: data/artifacts/beat3tower_32k/data_matrices_step1.npz
    # Artifact genre source. Honored by the analyze pipeline's artifacts stage
    # AND the GUI Build Artifacts button.
    #   legacy: raw track/album/artist genre tables only
    #   enriched: AI-enriched sidecar signatures REPLACE raw lookups for
    #             enriched releases; unenriched releases fall back to legacy
    #   graph: published authority (release_effective_genres, maintained by the
    #          publish stage) REPLACES raw lookups for covered albums; genre_ids
    #          map to canonical taxonomy names. Requires a prior publish run.
    #   hybrid_shadow: shadow-build for evaluation (writes under shadow/)
    # Changing this requires an artifact rebuild + dense-sidecar rebuild
    # (the analyze pipeline's artifacts + genre-embedding stages do both).
    genre_source: legacy  # legacy | enriched | graph | hybrid_shadow
    # Genre-similarity matrix used to smooth X_genre_raw at artifact-build time.
    #   cooccurrence (default): Jaccard from library tag co-occurrence
    #   graph: derived from the curated layered genre taxonomy
    #           (data/layered_genre_taxonomy.yaml via scripts/build_graph_genre_similarity.py)
    # Flipping this forces a similarity-matrix rebuild on the next analyze/artifact run.
    genre_similarity:
      source: cooccurrence  # cooccurrence | graph
    random_seed: 0
    enable_logging: true

    # Hybrid embedding configuration (sonic + genre features combined)
    embedding:
      sonic_components: 32    # PCA dims for sonic features (8-64)
      genre_components: 32    # PCA dims for genre features (8-64)
      sonic_weight: 0.60      # Weight for sonic similarity (0.0-1.0)
      genre_weight: 0.40      # Weight for genre similarity (0.0-1.0)

    # Candidate pool configuration (tracks considered before construction)
    candidate_pool:
      similarity_floor: 0.20  # Min hybrid similarity to seed track (0.0-1.0)
      # Mode-specific sonic floors (hard gate before genre/hybrid):
      min_sonic_similarity_narrow: 0.10
      min_sonic_similarity_dynamic: 0.00
      # fallback if mode-specific not set:
      # min_sonic_similarity: 0.00
      # candidates_per_artist / target_artists / max_pool_size / min_pool_size / seed_artist_bonus retired 2026-07 (corridor Phase 0): pool artist-cap + backstop removed; beam enforces diversity
      max_artist_fraction: 0.125  # Max tracks from one artist as fraction of playlist
      duration_penalty_enabled: true    # Penalize long tracks vs median seed duration
      duration_penalty_weight: 0.60     # Penalty strength (higher = more severe)
      duration_cutoff_multiplier: 2.5  # Hard cutoff multiplier vs median seed duration
      title_exclusion_enabled: true     # Drop candidates with standalone title words below
      title_exclusion_words: ["interlude", "skit"]
      broad_filters: ["rock", "indie", "alternative", "pop"]  # Tags ignored for narrow-mode genre gating/sim
      genre_rescue_k: 40      # Re-admit top-K sonic-nearest tracks rejected ONLY by the genre gate
                              # (keeps sonic connectors so tight genre modes can't crater the worst
                              # edge — slider eval 2026-07-04). 0 = off (rollback).

    # Artist style-aware pier-bridge (applies to --artist playlists)
    artist_style:
      enabled: true            # Style-aware (medoid-clustered) pier-bridge for artist playlists (matches live config.yaml)
      toptracks_min_artist_tracks: 8   # min local tracks to fetch Last.fm top-tracks (popularity stage); independent of artist_style.enabled
      cluster_k_min: 3
      cluster_k_max: 6
      cluster_k_heuristic_enabled: true
      piers_per_cluster: 1
      # per_cluster_candidate_pool_size / pool_balance_mode RETIRED 2026-07
      # (corridor Phase 1 Task 8): fed build_balanced_candidate_pool, the
      # per-cluster sonic-neighbor "external pool" that hard-clamped Artist
      # mode's allowed_track_ids -- deleted; corridor pooling's library-wide
      # eligible universe replaces it. A leftover value warns loudly at
      # startup, it does not silently no-op.
      internal_connector_priority: true
      internal_connector_max_per_segment: 2
      bridge_floor:
        strict: 0.10   # Ultra-cohesive (Phase 1)
        narrow: 0.05   # Relaxed from 0.08 (Phase 3A)
        dynamic: 0.02  # Relaxed from 0.03 (Phase 3A)
      bridge_score_weights:
        dynamic:
          bridge: 0.6
          transition: 0.4
        narrow:
          bridge: 0.7
          transition: 0.3
      genre_tiebreak_weight: 0.05
      # Energy-aware spread (artist mode): pull each cluster's medoid toward an
      # evenly-spaced arousal slot so the piers tile the artist's energy range.
      # 0.0 = off (default, identical to legacy). Calibrate upward after A/B.
      medoid_energy_weight: 0.0
      energy_feature: arousal_p50      # arousal_p10 | arousal_p50 | arousal_p90 | danceability
      energy_slot_lo_pct: 10.0         # robust arousal-span percentiles for slot targets
      energy_slot_hi_pct: 90.0
      # Reduce the artist to one canonical version per song before clustering
      # (studio/remaster preferred over live/demo/alt) so live takes and duplicate
      # releases don't become seeds. A live cut is kept only if it's the sole version.
      dedupe_versions: true
      medoid_popularity_weight: 0.0    # within-slot bias toward Last.fm-popular tracks; keep < medoid_energy_weight
      popular_seeds_weight: 1.0   # ON-mode medoid popularity weight (was 0.5)
      popularity_max_age_days: 30      # refetch an artist's top tracks if the cache entry is older
      # Pier bridgeability veto (artist mode; fire piers exempt). A track can
      # only seat as a pier if it has >= pier_bridgeability_k non-seed-artist
      # library neighbors at calibrated T >= pier_bridgeability_floor_t (same
      # units as tail_dp_floor / repair t_floor). Clusters whose members all
      # fail contribute no piers; their slots reallocate. Motivating incident:
      # docs/superpowers/specs/2026-07-03-pier-bridgeability-design.md.
      pier_bridgeability_enabled: true
      pier_bridgeability_floor_t: 0.30
      pier_bridgeability_k: 10
      # Genre-relevance gate on the bridgeability neighbor set: a library track only
      # counts as a bridge neighbor if its genre cosine to the seed artist's profile
      # is >= this floor. Prevents degenerate/collapsed sonic neighbors (e.g. MuQ maps
      # near-silent audio to one point) from faking bridgeability. Lower = more lenient.
      pier_bridgeability_genre_floor: 0.30
      # Support-aware pier demotion (Corridor Phase 2 Task 3): a candidate whose
      # neighborhood WITHIN ITS OWN ARTIST'S CATALOG (not library-wide -- a probe found
      # library-wide density doesn't separate off-character outlier-EP tracks; see
      # docs/corridor_baseline/phase2_task3_probe_findings.md) is sparser than typical
      # gets its medoid score demoted, never vetoed -- pier COUNT never shrinks.
      # 0.0 strength = inert (today's pre-Task-3 behavior).
      pier_support_enabled: true
      pier_support_k: 10
      pier_support_demotion_strength: 1.0
      pier_support_floor: 0.50         # diagnostic-only; never filters candidates
      # Arc-aware ordering: prefer NOT seating the lowest-support pier at either
      # terminal (opening/closing) seat when an alternate sonic-order start avoids
      # it -- a tie-break among orderings the existing greedy sequencer could
      # already produce, never a new topology, never fails.
      pier_support_terminal_avoidance: true

    # ─────────────────────────────────────────────────────────────────────
    # Multi-artist blend (spec 2026-07-29-multi-artist-blend-design.md)
    # Two or more artist chips -> every pier drawn from the region the named
    # artists share. Inert with a single artist. Soft bias only.
    # ─────────────────────────────────────────────────────────────────────
    multi_artist:
      enabled: true
      overlap_weight: 0.6          # strength of the pull toward the other artist(s).
                                   # 0.0 = explicit rollback (piers stay characteristic).
      genre_share: 0.25            # split within the affinity term; the rest is MuQ.
      max_artists: 4
      joint_pier_min_budget: 3     # min total piers before a jointly-credited seat is reserved
      # alternation_bonus: REMOVED (2026-07-30, forced-interleaving rewrite).
      # Pier alternation is now a hard constraint (order_with_alternation
      # forces the maximum achievable alternation, then picks the minimax-best
      # order among those), not a scored preference -- there is no bonus
      # weight left to tune. A leftover value here is caught and warned on
      # loudly at startup (src.playlist_gui.worker._warn_retired_keys).
      low_overlap_threshold: 0.15  # mean pier affinity below this -> report it to the user

    # Construction scoring weights
    # score = alpha*seed_sim + beta*transition_sim + gamma*diversity - penalty
    scoring:
      alpha: 0.55             # Seed similarity weight (0.0-1.0)
      beta: 0.55              # Transition similarity weight (0.0-1.0)
      gamma: 0.04             # Artist diversity bonus (0.0-0.2)
      # Alpha schedule: "constant" uses alpha throughout, "arc" varies by position
      alpha_schedule: arc     # "constant" or "arc"
      alpha_start: 0.65       # Alpha at playlist start (if arc)
      alpha_mid: 0.45         # Alpha at midpoint (if arc)
      alpha_end: 0.60         # Alpha at playlist end (if arc)
      arc_midpoint: 0.55      # Where midpoint falls in playlist (0.0-1.0)

    # Constraint configuration
    constraints:
      min_gap: 6              # Min positions between same artist
      hard_floor: true        # Reject (true) vs penalize (false) below floor
      # Per-mode transition floors (higher = fewer "teleports")
      transition_floor_dynamic: 0.35
      transition_floor_narrow: 0.45
      # transition_floor: 0.35  # Optional global override for all modes
      center_transitions: true # Center X_start/X_end matrices for scoring
      # Artist identity resolution (normalize artist names for better deduplication)
      artist_identity:
        enabled: true         # Enable artist name normalization (recommended)
        strip_trailing_ensemble_terms: true  # Remove "Orchestra", "Trio", etc.
        split_delimiters:     # Collaboration delimiters to split on
          - ","               # "Artist A, Artist B"
          - " & "             # "Artist A & Artist B"
          - " and "           # "Artist A and Artist B"
          - " feat. "         # "Artist A feat. Artist B"
          - " feat "
          - " featuring "
          - " ft. "
          - " ft "
          - " with "          # "Artist A with Artist B"
          - " x "             # "Artist A x Artist B"
          - " + "             # "Artist A + Artist B"

    # Pier-bridge ordering/scoring (applies to all playlists when pipeline=ds)
    pier_bridge:
      # Variable bridge length (Lever 2, default ON as of 2026-06-28): each segment
      # flexes its interior length within a soft total band [N-band, N+band] to land
      # more smoothly on the next pier, lifting the worst transition. Costs ~2.5-3x
      # generation time on playlists with a weak segment. Set false to roll back to the
      # rigid even split. flex=per-segment +/- tracks; band=total track-count slack;
      # min_edge=only flex a segment whose worst edge is below this; max_flex_segments=
      # deterministic cap on how many segments may flex.
      variable_bridge_length: true
      # variable_bridge_flex: 2
      # variable_bridge_min_edge: 0.30
      # variable_bridge_max_flex_segments: 3
      # SP2 seed-character anti-collapse (live default): "anti_center" demotes bridge
      # interiors that sit closer to the local generic center than to their own piers
      # (the within-bridge sag fix; strength ~2.0 = sweet spot). Set mode:off to disable.
      seed_character_mode: anti_center
      seed_character_strength: 2.0
      # SP3 mini-piers (live default): pin a high-character waypoint as an extra pier in a
      # long bridge so the beam can't sag past it (structural anti-sag; dreampop sag
      # 103%->63%). max_interior=K: split any segment whose interior would exceed K.
      # smoothness_margin trades worst-edge for character. Set enabled:false to roll back.
      mini_pier_enabled: true
      mini_pier_max_interior: 5
      mini_pier_smoothness_margin: 0.12
      # Even anchor spacing (live default 2026-07-06): when mini-piers subdivide, equalize
      # waypoints across every seed-gap so anchors stay evenly spaced (else the trailing
      # anchors bunch). Costs one extra pinned waypoint. Set false to roll back.
      mini_pier_balance_gaps: true
      # Tail-DP segment endgame (spec 2026-07-02, live default ON): after each
      # segment's beam+var-bridge finalizes, re-open the last min(2, interior)
      # slots and exactly maximize the window min-edge over the segment pool
      # (never-worse; falls back to the original tail on any internal error).
      # Set enabled:false to roll back to the beam's landing as-is.
      tail_dp:
        enabled: true
        epsilon: 0.02
        floor: 0.3
        # Relative trigger (Phase 2 Task 2, spec 2026-07-18, live default ON):
        # effective floor = max(floor, segment_mean_T - relative_epsilon).
        # 0.0 = legacy absolute-only rollback. See
        # docs/corridor_baseline/phase2_mechanism_probes.md.
        # Full legacy disable = relative_epsilon: 0.0 -- floor alone no longer
        # suffices (a non-zero relative_epsilon still keeps an effective floor
        # even with floor: 0).
        relative_epsilon: 0.25
      # Break-glass edge repair (spec 2026-07-02, live default ON): after tail-DP, if an
      # edge is STILL below t_floor (or centered_cos below centered_cos_floor), try
      # swapping the weaker interior endpoint for a pool candidate that lifts the edge —
      # pure-T scored, best-effort, never-worse, never a pier/seed. margin = min T-gain to
      # accept a swap; variety_guard optionally blocks swaps that make the segment too
      # self-similar. Set enabled:false to roll back to tail-DP's landing.
      edge_repair:
        centered_cos_floor: -0.5
        enabled: true
        margin: 0.05
        t_floor: 0.3
        # Relative trigger (Phase 2 Task 2, spec 2026-07-18, live default ON):
        # effective floor = max(t_floor, playlist_mean_T - relative_epsilon).
        # 0.0 = legacy absolute-only rollback. See
        # docs/corridor_baseline/phase2_mechanism_probes.md.
        # Full legacy disable = relative_epsilon: 0.0 -- t_floor alone no
        # longer suffices (a non-zero relative_epsilon still keeps an
        # effective floor even with t_floor: 0).
        relative_epsilon: 0.25
        variety_guard:
          enabled: false
          threshold: 0.85
      # Remove-only last resort (repair-by-deletion, spec 2026-07-02, live default ON):
      # after break-glass repair, if an edge is STILL below floor, delete the interior
      # endpoint whose removal merges the two edges — only if the merge strictly lifts
      # the worst edge (never-worse), and never a pier/seed. enabled:false = roll back.
      edge_delete:
        enabled: true
        floor: 0.3
        max_deletions: 4
      # Tag steering (artist-mode GUI chips; soft lean, never a gate).
      # Per-request tag list arrives via policy override (tag_steering_tags).
      tag_steering_pool_blend: 0.5    # 0=ignore tags, 1=pool centroid is pure target
      tag_steering_pier_weight: 0.3   # on-tag bonus in artist pier (medoid) scoring
      # Tag steering: how hard artist-mode pier selection skews toward on-tag sonic
      # clusters. 0 = even across clusters (legacy); 1 = pure affinity weighting.
      # Soft skew keeps every cluster represented (floor 1 pier). Inert without tags.
      pier_tag_skew: 0.6
      tag_steering_pool_guarantee_max: 30        # force-admit up to N eligible on-tag tracks into the DS pool past the per-artist rank walk (0 = rollback/off)
      tag_steering_pool_guarantee_per_artist: 3  # per-artist cap within the guaranteed set (keeps the roster diverse)
      tag_first_pier_selection: true   # steer piers from the artist's authority on-tag tracks (rollback: false = legacy tag-skew allocation)
      tag_first_topup_mult: 2.0        # top-up floor = max(cluster_k_min, ceil(mult * target_pier_count)) on-tag candidates before topping up by affinity
      tag_steering_sonic_weight: 0.5          # weight of the library-learned sonic-prototype term in pier scoring
      tag_steering_sonic_blend: 0.35          # blend of the centered (tag-specific) sonic affinity into the pool's sonic admission (the binding lever)
      tag_steering_sonic_beam_weight: 0.0     # opt-in beam ranking bonus; OFF by default (weight sweep 2026-07-08 proved it inert-to-harmful — the pool carries the lean)
      tag_steering_worst_edge_band: 0.0       # worst-edge tolerance so the beam term can trade a bounded sliver of smoothness for on-tag adherence (0=strict minimax, tag term is a never-firing tie-break). Only acts when the beam weight>0. See docs/superpowers/specs/2026-07-08-tag-steering-architecture.md (blocked upstream by segment-pool candidate propagation — kept OFF)
      # Bridge-side Phase A (stage D, segment_pool_builder.py — spec 2026-07-09): makes
      # on-tag-but-sonically-peripheral tracks reachable as bridges. Steering-gated —
      # all three are no-ops (segment pool byte-identical) unless tag steering resolved
      # on-tag ids for this run, regardless of these values.
      tag_steering_relax_bridge_admission: true   # stage-D: admit stepping-stones near EITHER pier (min->max) when steering; false = legacy min()
      tag_steering_segment_guarantee_max: 8       # per-segment on-tag tracks force-admitted past the bridge floor (0 = off)
      tag_steering_segment_guarantee_per_artist: 2
      # Bridge-side Phase B (artist-mode pier block, playlist_generator.py — spec
      # 2026-07-09): injects up to N on-tag tracks as PIERS (not just bridge
      # stepping-stones) so a sonically-peripheral on-tag clique is guaranteed to
      # appear, not just reachable. Steering-gated: no-op (ordered_medoids
      # unchanged, byte-identical) unless tag steering resolved on-tag ids for
      # this run, regardless of these values.
      tag_steering_anchor_max: 3          # on-tag tracks injected as piers (0 = Phase-A-only / off)
      tag_steering_anchor_min_bridge: 0.35  # min sonic cosine to a seed pier for an anchor to qualify (no islands)
      tag_steering_anchor_per_artist: 1   # per-artist cap within the anchor set
      # Anchor PLACEMENT (spec 2026-07-27): order the artist piers first, then insert
      # anchors into the interior gaps (at most one per gap). Makes two rules
      # structural instead of hoped-for: an anchor is never terminal, and no two
      # anchors are adjacent. false = legacy append + global re-order (the path that
      # ended a Sonic Youth playlist on Built To Spill). Feasibility is K <= P-1 for
      # P artist piers; excess anchors are dropped by selection rank and LOGGED.
      tag_steering_anchor_gap_insertion: true
      tag_steering_prototype_min_support: 25  # min library tracks/tag to trust the sonic prototype (else genre-dense only)
      tag_steering_prototype_min_cohesion: 0.15  # min intra-set cohesion; below this the tag is sonically multimodal -> genre-dense only
      # Total-generation wall-clock budget (seconds). A single shared deadline is
      # computed once at generation start (before any One-Each retries) and threaded
      # into all segment loops and relaxation tiers so NO path can collectively exceed
      # this budget. 60s leaves a comfortable margin under the 90s hard ceiling for
      # pool-build + Last.fm overhead (killer cell measured 87.8s at 70s, only ~2s
      # under). Raise if you have a large library and many seeds; lower for tighter
      # latency guarantees. LIVE DEFAULT 0 = time limit DISABLED (quality-first: the
      # beam / var-bridge / mini-piers always run to completion, no fallback bail). Set a
      # positive value (e.g. 60) to re-arm the budget once optimizing for speed.
      generation_budget_s: 0
      # Bridge-local gate: require min(sim_to_pier_A, sim_to_pier_B) >= floor
      bridge_floor_strict: 0.10   # Ultra-cohesive (Phase 1)
      bridge_floor_narrow: 0.05   # Relaxed from 0.08 (Phase 3A)
      bridge_floor_dynamic: 0.02  # Relaxed from 0.03 (Phase 3A)
      # Edge scoring weights (bridge harmonic mean vs local transition)
      weight_bridge_dynamic: 0.6
      weight_transition_dynamic: 0.4
      weight_bridge_narrow: 0.7
      weight_transition_narrow: 0.3
      # Small genre tie-breaker (never rescues hard gates)
      genre_tiebreak_weight: 0.05
      # Genre arc steering (opt-in; default ON here).
      # When enabled the beam scores genre on the dense PMI-SVD embedding, rejects
      # edges below genre_arc_floor (absolute fallback), and adds weight_genre * genre_sim
      # as a renormalized third weight (bridge + transition + genre sum to 1).
      # genre_arc_floor_percentile / genre_admission_percentile use distribution-relative
      # floors: Task 8 calibrates the values below.
      genre_steering_enabled: true
      # Steering space (default "taxonomy"):
      #   taxonomy — (DEFAULT) route the arc through the SP3a taxonomy graph (twee pop ->
      #              jangle pop -> indie pop -> synth-pop) and score with the hub-damped
      #              taxonomy similarity, so broad genres connect the arc without collapsing
      #              it. Uses the in-artifact X_genre_raw (rebuild-robust); needs no per-track
      #              taxonomy assignments. Uncovered piers fall back to sonic-only.
      #   dense    — legacy 64-dim PMI-SVD genre embedding (corpus co-occurrence). Opt-in
      #              only; requires the dim64 sidecar. If its X_genre_dense is unavailable
      #              (sidecar vocab mismatch) generation RAISES rather than silently steering
      #              on nothing — rebuild via scripts/build_genre_embedding.py to use it.
      genre_steering_source: taxonomy    # taxonomy | dense
      # genre_admission_aggregate: centroid | per_seed (default: centroid)
      #   centroid: one mean-of-seeds centroid for the global admission gate (legacy)
      #   per_seed: union of per-seed neighborhoods — admits tracks near ANY seed, not
      #             just the average. Fixes starvation for diverse seed sets.
      genre_admission_aggregate: centroid
      # segment_pool_genre_weight: 0.0..1.0 (default: 0.0 = pure sonic)
      #   Blends genre hmean into segment pool re-ranking (no new hard gate).
      segment_pool_genre_weight: 0.0
      dj_route_shape: ladder          # ladder | linear
      weight_genre_strict: 0.30
      weight_genre_narrow: 0.20
      weight_genre_dynamic: 0.12
      weight_genre_discover: 0.06
      genre_arc_floor_strict: 0.50
      genre_arc_floor_narrow: 0.40
      genre_arc_floor_dynamic: 0.25
      genre_arc_floor_discover: 0.10
      # Pairwise genre-edge soft penalty: when the two adjacent tracks' tag-level
      # taxonomy similarity falls below the floor (taxonomy steering only; genreless/
      # uncovered tracks exempt), the edge score is demoted by genre_pair_penalty
      # rather than rejected. A hard gate detonates the relaxation cascade on broad-
      # genre segments (hub damping pushes legit candidates below floor) and blows
      # the time budget. floor 0.0 = off.
      genre_pair_floor_strict: 0.15
      genre_pair_floor_narrow: 0.10
      genre_pair_floor_dynamic: 0.10
      genre_pair_floor_discover: 0.05
      # Score subtracted from a below-floor edge (global, not per-mode).
      genre_pair_penalty: 0.5
      genre_admission_percentile_strict: 0.92
      genre_admission_percentile_narrow: 0.90
      genre_admission_percentile_dynamic: 0.85
      genre_admission_percentile_discover: 0.70
      # Adaptive sonic admission floor (Task 1): admits top (1-p) fraction of
      # the seed's sonic similarity distribution.  Replaces min_sonic_similarity
      # when active (> 0).  Initial conservative values — calibration eval-gate
      # sets finals.  0.0 = off (legacy absolute-floor behavior unchanged).
      sonic_admission_percentile_strict: 0.75
      sonic_admission_percentile_narrow: 0.60
      sonic_admission_percentile_dynamic: 0.40
      sonic_admission_percentile_discover: 0.20
      # Per-mode corridor width (spec section 4, pulled forward from Phase 2
      # by Dylan's 2026-07-18 decision): sonic_mode -> corridor width
      # percentile. NOT the same knob as sonic_admission_percentile_* above —
      # that one is keyed by cohesion_mode and feeds the legacy candidate-pool
      # gate (a near-dead path under corridor pooling: it only reaches the
      # beam through the disabled-by-default dj_bridging path and the
      # last-resort terminal-greedy fallback). These four fields are keyed by
      # sonic_mode and ARE the corridor path's live sonic-similarity lever —
      # see PierBridgeConfig.corridor_width_percentile_<mode> and
      # pier_bridge.corridor.resolve_corridor_width_percentile. Higher
      # percentile = tighter/narrower corridor (only the best-scoring
      # candidates admitted); lower = wider. sonic_mode="off" hardcodes to
      # 0.0 (whole eligible universe) — no config field for it.
      corridor_width_percentile_strict: 0.985
      corridor_width_percentile_narrow: 0.975
      corridor_width_percentile_dynamic: 0.95
      corridor_width_percentile_discover: 0.94
      # Tuning escape hatch: uncomment to force EVERY sonic_mode to this one
      # width, overriding the per-mode mapping above unconditionally.
      # corridor_width_percentile: 0.95
      genre_arc_floor_percentile_strict: 0.90
      genre_arc_floor_percentile_narrow: 0.85
      genre_arc_floor_percentile_dynamic: 0.70
      genre_arc_floor_percentile_discover: 0.50
      # Soft genre whiplash penalty (does NOT gate): if edge_genre < threshold,
      # final_edge_score *= (1 - strength). Per-mode so stricter modes can
      # enforce local genre continuity while discover/off keep safety-net
      # behavior only. See docs/PLAYLIST_ORDERING_TUNING.md Knob 6 for tuning.
      #
      # CAUTION: A flat threshold of 0.80 was tried and reverted 2026-05-21 —
      # it introduced worse worst-case edges (min_T 0.268→0.112, below_floor=1)
      # by shifting the beam onto paths with low T but high G, which the penalty
      # cannot see. dynamic=0.73 was calibrated on 2026-05-23 (G floor 0.723→0.788,
      # min_T 0.557→0.541). Raise only after confirming min_T and below_floor hold.
      soft_genre_penalty_threshold_strict: 0.82
      soft_genre_penalty_threshold_narrow: 0.78
      soft_genre_penalty_threshold_dynamic: 0.73
      soft_genre_penalty_threshold_discover: 0.20
      soft_genre_penalty_threshold_off: 0.20
      soft_genre_penalty_strength_strict: 0.40
      soft_genre_penalty_strength_narrow: 0.30
      soft_genre_penalty_strength_dynamic: 0.15
      soft_genre_penalty_strength_discover: 0.10
      soft_genre_penalty_strength_off: 0.10
      # Instrumental lean: additive beam+pool demotion = weight * voice_prob when the
      # "Instrumental" checkbox is on. Steep enough to be decisive without a de-facto
      # hard gate. Tune via tests/integration/test_gui_fidelity_instrumental.py (Task 13).
      instrumental_penalty_weight: 0.6
      # Optional genre tie-break band for penalty application (default: off).
      genre:
        tie_break_band: null  # e.g. 0.02 to apply penalty only on close calls
      # Segment-local candidate pool strategy (recommended).
      # "segment_scored" builds a per-segment pool by scoring candidates jointly vs BOTH
      # endpoints (pier A and pier B), rather than unioning neighbor lists.
      segment_pool_strategy: segment_scored
      segment_pool_max: 400
      max_segment_pool_max: 1200

      # Artist exclusion rules for bridge segment interiors
      # Controls whether pier/seed artists can appear in bridge segments
      disallow_pier_artists_in_interiors: true   # Exclude pier artists from their own bridge segments (recommended)
      disallow_seed_artist_in_interiors: false   # Allow seed artist in all segments (only affects multi-seed mode; Artist mode always disallows)
      # Example: If piers are [Ramones, Replacements, Pavement]:
      #   - Ramones→Replacements: Ramones excluded (pier A), Replacements excluded (pier B)
      #   - Replacements→Pavement: Ramones allowed (not a pier), Replacements excluded (pier A), Pavement excluded (pier B)

      # Progress constraint (A→B) to reduce "teleporting" / bouncing during bridges.
      # Uses projection onto the AB direction in the sonic similarity space.
      progress:
        enabled: true
        monotonic_epsilon: 0.05
        penalty_weight: 0.15
      # Optional: progress arc scoring to shape segment pacing (default OFF).
      # Calibration recipe (docs/PLAYLIST_ORDERING_TUNING.md Knob 11,
      # docs/corridor_baseline/phase2_task4_progress_arc_probe.md): the
      # "audible" weight is cell-dependent (scales with pier-to-pier
      # distance) -- 0.25 is inconsistent (near-inert on some segments,
      # already-saturated on others); weight=0.5 is reliably audible if you
      # want to experiment. No clear win across cells found -- stays OFF.
      progress_arc:
        enabled: false
        weight: 0.25
        shape: arc               # linear or arc
        tolerance: 0.05          # dead-zone around target progress
        loss: abs                # abs, squared, huber
        huber_delta: 0.10
        max_step: null           # max forward progress jump; null disables
        max_step_mode: penalty   # penalty or gate
        max_step_penalty: 0.25
        autoscale:
          enabled: false
          min_distance: 0.05
          distance_scale: 0.50
          per_step_scale: false

      # Optional: DJ-style genre waypoint guidance (default OFF).
      #
      # To enable DJ bridging with full genre-waypoint routing:
      #   1. Set enabled: true
      #   2. Set pooling.strategy: dj_union (for S1+S2+S3 union pooling)
      #   3. Set route_shape: ladder (for genre graph routing)
      #   4. Ensure genre metadata exists in your library
      #
      # Example minimal config for DJ bridging:
      #   dj_bridging:
      #     enabled: true
      #     route_shape: ladder
      #     pooling:
      #       strategy: dj_union
      #
      dj_bridging:
        enabled: false
        seed_ordering: auto          # auto | fixed
        seed_ordering_weight_sonic: 0.60
        seed_ordering_weight_genre: 0.20
        seed_ordering_weight_bridge: 0.20
        anchors:
          must_include_all: true
        route_shape: linear          # linear | arc | ladder
        waypoint_weight: 0.15
        waypoint_floor: 0.20
        waypoint_penalty: 0.10
        waypoint_tie_break_band: null
        waypoint_cap: 0.05
        pooling:
          # Pool construction strategy for segment candidates
          # - baseline: neighbors(A) ∪ neighbors(B) (default, safe fallback)
          # - dj_union: RETIRED 2026-07 (corridor Phase 1 Task 8) -- its
          #   implementation lived entirely inside the deleted legacy
          #   segment-scored pool builder; setting strategy: dj_union is now
          #   a no-op (corridor pooling is the sole segment-pool strategy).
          #
          # IMPORTANT: Use nested 'pooling.strategy' key as shown below.
          # The flat key 'dj_pooling_strategy' is deprecated and will log a warning.
          strategy: baseline        # baseline (dj_union retired, see above)
          # k_local / k_toward / k_genre / k_union_max / step_stride /
          # debug_compare_baseline RETIRED 2026-07 (corridor Phase 1 Task 8):
          # only consumed by the deleted dj_union pool builder. A leftover
          # value warns loudly at startup, it does not silently no-op.
          cache_enabled: true
        allow_detours_when_far: true
        far_thresholds:
          sonic: 0.45
          genre: 0.60
          connector_scarcity: 0.10
        connector_bias:
          enabled: true
          max_per_segment_linear: 1
          max_per_segment_adventurous: 3
        connectors:
          enabled: false             # Alternate connector bias config (overrides connector_bias when set)
          max_connectors: 2
          use_only_when_far: true
          far_threshold: 0.50
        ladder:
          top_labels: 5
          min_label_weight: 0.05
          min_similarity: 0.20
          max_steps: 6
          use_smoothed_waypoint_vectors: false
          smooth_top_k: 10
          smooth_min_sim: 0.20
        relaxation:
          enabled: false
          max_attempts: 4
          emit_warnings: true
          allow_floor_relaxation: false
        waypoint_fallback_k: 25
        micro_piers:
          enabled: false
          max: 1
          max_micro_piers_per_segment: 1
          candidate_source: union_pool  # connectors | union_pool | both
          topk: 5
          top_k: 5
          selection_metric: max_min_sim
        diagnostics:
          # Waypoint rank impact diagnostic (opt-in, NO behavior change)
          # Measures whether waypoint scoring can change candidate rankings
          # Default: false (disabled, zero cost)
          waypoint_rank_impact_enabled: false
          waypoint_rank_sample_steps: 3  # Sample up to N evenly-spaced beam steps

        # ==================================================================================
        # PHASE 2 + PHASE 3: Genre Bridging Enhancements
        # ==================================================================================
        # Phase 2 fixes hub genre collapse (waypoints defaulting to generic genres).
        # Phase 3 fixes saturation issues (waypoint/coverage scores plateauing at cap).
        #
        # Phase 2: Vector Mode + IDF + Coverage
        # - Vector Mode: Direct multi-genre interpolation (bypasses shortest-path labels)
        # - IDF Weighting: Emphasize rare genres (shoegaze), suppress common (indie rock)
        # - Coverage Bonus: Reward matching anchor's top-K signature genres
        #
        # Phase 3: Saturation & Provenance Fixes
        # - Centered Waypoint Delta: Subtract step-wise baseline to allow negative deltas
        # - Tanh Squashing: Smooth squashing to prevent hard plateaus at cap
        # - Coverage Improvements: Raw presence source + weighted mode for better gradient
        # - Logging Fixes: Genre_sim uses IDF space when enabled
        # - Provenance Tracking: Membership-based overlap accounting (not priority-based)
        #
        # See docs/dj_bridge_architecture.md for complete documentation.
        # ==================================================================================

        # IMPORTANT: These settings must be nested under pier_bridge.dj_bridging as shown.
        # The exact nesting is required for config parsing (see pipeline.py lines 1089-1139).

        # Vector Mode (Phase 2) - CRITICAL for fixing hub genre collapse
        # - "vector": Direct multi-genre interpolation, preserves full genre signatures (RECOMMENDED)
        # - "onehot": Shortest-path label selection (legacy, causes hub collapse)
        dj_ladder_target_mode: vector        # onehot | vector

        # Vector source matrix (when mode=vector)
        # - "smoothed": Similarity-weighted genre vectors (recommended)
        # - "raw": Binary genre vectors (0/1 per genre)
        dj_genre_vector_source: smoothed     # smoothed | raw

        # IDF Weighting (Phase 2) - Emphasize rare genres, suppress common genres
        # Formula: idf[g] = log((N+1)/(df[g]+1))^power
        # Effect: Rare genres (shoegaze) → high weight (0.8-1.0)
        #         Common genres (indie rock) → low weight (0.1-0.3)
        dj_genre_use_idf: true               # Enable IDF weighting (RECOMMENDED)
        dj_genre_idf_power: 1.0              # IDF exponent (1.0 = standard log formula)
        dj_genre_idf_norm: max1              # Normalization: max1 | sum1 | none

        # Coverage Bonus (Phase 2) - Reward matching anchor's top-K genres
        # Tracks top-K genres from each anchor (pier A, pier B)
        # Rewards candidates that match these signature genres
        # Schedule decay: wA=(1-s)^power (strong near A), wB=s^power (strong near B)
        dj_genre_use_coverage: true          # Enable coverage bonus (RECOMMENDED)
        dj_genre_coverage_top_k: 8           # Track top-N genres per anchor
        dj_genre_coverage_weight: 0.15       # Coverage bonus weight (additive to score)
                                             # NOTE: If weighted coverage is too strong, use 0.10 as safe fallback
        dj_genre_coverage_power: 2.0         # Schedule decay power (2.0 = quadratic)
        dj_genre_presence_threshold: 0.02    # Min genre weight to count as "present" (2%)
                                             # NOTE: Smoothed vectors inflate presence; tune 0.02-0.05 as needed

        # Phase 3: Centered Waypoint Delta (fixes waypoint saturation)
        # - "absolute": Legacy mode (delta = weight * sim), can pin at cap
        # - "centered": Subtract step baseline (delta = weight * (sim - sim0)), allows negative deltas
        dj_waypoint_delta_mode: centered     # absolute | centered (RECOMMENDED: centered)
        dj_waypoint_centered_baseline: median  # median | mean (for centered mode)

        # Phase 3: Waypoint Squashing (prevents hard plateaus at cap)
        # - "none": Hard clamp at waypoint_cap (legacy, causes plateaus)
        # - "tanh": Smooth squashing (delta = cap * tanh(alpha * raw / cap))
        dj_waypoint_squash: tanh             # none | tanh (RECOMMENDED: tanh)
        dj_waypoint_squash_alpha: 4.0        # Alpha for tanh squashing (higher = steeper, 4.0 recommended)

        # Phase 3: Coverage Presence Source (fixes smoothed inflation)
        # - "same": Use same matrix as scoring (can inflate presence with smoothed vectors)
        # - "raw": Use raw genres for presence check (avoids false positives)
        dj_coverage_presence_source: raw     # same | raw (RECOMMENDED: raw with smoothed targets)

        # Phase 3: Coverage Mode (fixes coverage ties/saturation)
        # - "binary": Count genres present (0/1 per genre), discrete values
        # - "weighted": Mean of genre weights, creates gradient
        dj_coverage_mode: weighted           # binary | weighted (RECOMMENDED: weighted)

        # Production Config Example (Recommended Defaults):
        # This configuration is stable and non-saturating for most use cases.
        #
        # dj_ladder_target_mode: vector
        # dj_genre_vector_source: smoothed
        # dj_genre_use_idf: true
        # dj_genre_idf_power: 1.0
        # dj_genre_idf_norm: max1
        # dj_genre_use_coverage: true
        # dj_genre_coverage_top_k: 8
        # dj_genre_coverage_weight: 0.15
        # dj_genre_coverage_power: 2.0
        # dj_genre_presence_threshold: 0.02
        # waypoint_weight: 0.25
        # waypoint_cap: 0.10
        # dj_waypoint_delta_mode: centered
        # dj_waypoint_centered_baseline: median
        # dj_waypoint_squash: tanh
        # dj_waypoint_squash_alpha: 4.0
        # dj_coverage_presence_source: raw
        # dj_coverage_mode: weighted
        # pooling.strategy: dj_union
        # route_shape: ladder

      # Duration penalty (geometric): penalizes bridge candidates based on percentage excess
      # over pier tracks. Uses a three-phase curve that accelerates from gentle to severe.
      # Does NOT block long tracks (hard filter does that), but reduces score based on
      # how much longer they are than the pier tracks.
      #
      # Three-phase geometric curve (percentage-based):
      #   0-20% excess:   Gentle penalties (barely noticeable)
      #   20-50% excess:  Moderate penalties (increasing)
      #   50-100% excess: Steep penalties (strong discouragement)
      #   >100% excess:   Severe penalties (track is 2x+ longer than pier)
      duration_penalty:
        enabled: true                # Enable duration penalty (default: true)
        weight: 0.30                 # Penalty strength (default: 0.30, range: 0.10-0.50)
        # Example: 200s pier track → 400s candidate (+100%) = severe penalty ≈ 0.75

      # Interior artist policies (optional):
      # - For `--artist` playlists, the seed artist is DISALLOWED in bridge interiors by default (piers-only).
      # - To override in any run, you can set:
      #   disallow_seed_artist_in_interiors: false   # allow seed artist inside segments
      #   disallow_pier_artists_in_interiors: true   # disallow endpoint artists inside segments

      # Energy steering (opt-in: set >0 to enable; requires energy sidecar).
      # Soft penalties that guide the beam toward a pier-to-pier energy arc without
      # hard-gating any candidate. Both terms are 0.0 (disabled) by default.
      # energy_step_strength: 0.0   # penalty weight for adjacent-step energy jump > cap
      # energy_step_cap: 0.0        # max z-std energy jump between adjacent tracks (ignored when step_strength=0)
      # energy_arc_strength: 0.0    # penalty weight for deviation from the pier->pier energy arc
      # energy_arc_band: 0.0        # z-std dead-band around arc target (ignored when arc_strength=0)

      # Segment infeasibility handling: the legacy per-segment relaxation
      # ladder (enabled/strategy/backoff_steps/min_bridge_floor/
      # max_attempts_per_segment/widen_search_on_backoff/extra_*/
      # transition_floor_relaxation_enabled/min_transition_floor/
      # genre_arc_relaxation_enabled/min_genre_arc_percentile) was RETIRED
      # 2026-07 (corridor Phase 1 Task 8): the corridor widening ladder
      # (corridor_widen_step/corridor_widen_attempts/
      # corridor_widen_improvement_epsilon, above) is the sole segment-level
      # recovery mechanism now. A leftover value warns loudly at startup, it
      # does not silently no-op. Only guarantee_feasible (the terminal
      # last-resort placement) and greedy_genre_weight (its genre blend
      # weight, default 0.5) remain live:
      infeasible_handling:
        # When true, a terminal last-resort placement guarantees generation never
        # fails completely even after the corridor widening ladder is exhausted.
        guarantee_feasible: true

      # Optional: write a markdown run audit report (default OFF).
      # Useful when debugging infeasible segments or verifying gating behavior.
      audit_run:
        enabled: false
        out_dir: "docs/run_audits"
        include_top_k: 25
        max_bytes: 350000
        write_on_success: true
        write_on_failure: true

