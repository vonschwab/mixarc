  # Genre mode (spec 2026-07-24-genre-mode-design.md). NOTE: distinct from
  # `genre_mode` above, which is the pool-GATING axis. This block configures the
  # "pick a genre, get a playlist" generation mode.
  genre_playlist:
    # Bridge-pool breadth: minimum hub-damped taxonomy similarity to the chosen
    # genre. Keyed by cohesion_mode. Higher = tighter.
    similarity_threshold_strict: 0.50
    similarity_threshold_narrow: 0.42
    similarity_threshold_dynamic: 0.35
    similarity_threshold_discover: 0.20
    # Starvation relaxation: thresholds tried in order when the pool is too small.
    # Steps at or above the starting threshold are ignored.
    relaxation_steps: [0.35, 0.20, 0.10]
    # Composite seed score weights.
    seed_weight_prominence: 1.0    # cross-artist Last.fm listeners (log-scaled)
    seed_weight_canonicity: 0.5    # within-artist Last.fm rank
    seed_weight_centrality: 0.75   # authority confidence / genre purity
    seed_weight_typicality: 0.75   # sonic closeness to THIS genre's centroid
    seed_weight_investment: 0.15   # how much of that artist you own in this genre
    # A sonic cluster smaller than this cannot donate a pier (avoids oddball anchors).
    min_cluster_size: 3
    # How many per-cluster candidates (ranked by cluster_artist_tracks's internal
    # sonic-centrality/duration/support criteria) reach the composite seed score
    # above. This is meant as a PURE VETO FILTER, not a ranking cut: the composite
    # score (prominence/canonicity/centrality/typicality/investment) is what should
    # actually rank candidates within a cluster. Keep this well above the largest
    # real cluster size in the library (the fattest genre today is ~5.2k exact
    # members across >=3 clusters -- see config.example.yaml history/spec
    # 2026-07-24-genre-mode-design.md) so effectively every bridgeable member of
    # every cluster is scored, not just the top few by sonic centrality. Do not
    # lower this to "speed things up" -- the medoid machinery is cheap even at
    # library scale (~0.1s for a 5k-track single cluster, measured).
    seed_candidate_pool_size: 100000

  similarity:
    min_threshold: 0.5
    artist_direct_match: 0.9
    artist_shared_base: 0.4
    artist_shared_increment: 0.05
    artist_shared_max: 0.7
  limits:
    similar_tracks: 50
    similar_artists: 30
    extension_base: 10
    extension_increment: 20
  duration_match:
    enabled: true
    weight: 0.35
    window_frac: 0.25
    falloff: 0.6
    min_target_seconds: 40
  dedupe:
    title:
      enabled: true
      threshold: 92
      mode: loose
      short_title_min_len: 6
logging:
  level: DEBUG
  file: logs/playlist_generator.log
  # Per-playlist DEBUG log files (default-on). One file per generation under
  # `dir`, full DEBUG detail regardless of the console/GUI level, cleaned up
  # asynchronously after each generation. Rollback: set enabled: false to
  # restore today's behavior byte-for-byte.
  # See docs/superpowers/specs/2026-07-02-per-playlist-logging-design.md.
  playlist_logs:
    enabled: true
    dir: logs/playlists
    retention_days: 30
    level: DEBUG

  # Per-run Analyze Library logs (one rotated file per run, mirrors playlist_logs).
  analyze_logs:
    enabled: true
    dir: logs/analyze
    retention_days: 30
    level: DEBUG

# ─────────────────────────────────────────────────────────────────────────────
# Artifact-level settings (top-level section, default absent)
# ─────────────────────────────────────────────────────────────────────────────
# sonic_variant_override: A/B switch for the sonic similarity space. When set,
# it WINS over the variant the artifact declares via its X_sonic_variant key.
# `muq` is the live default (learned MuQ embedding). The MERT/tower CODE paths
# were removed by SP-B (Tasks 1-8, 2026-07); the artifact's legacy
# X_sonic_mert*/tower keys remain until the Task 10 rebuild, and the MERT
# source data is archived in Task 11. This knob remains the seam for a FUTURE
# sonic variant (e.g. auditioning a new embedding) without re-folding the
# artifact's other keys — set the override, don't re-bake.
# The named variant's X_sonic_<variant> key must exist in the artifact —
# otherwise generation fails at startup (a configured knob that cannot act is
# an error, never a silent no-op). Leave commented for normal use.
# artifacts:
#   sonic_variant_override: muq
